name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86-64:
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build locked release binaries
        run: cargo +stable build --release --locked --target x86_64-unknown-linux-gnu --bins
      - name: Package Linux x86_64 archive
        run: |
          ./scripts/package-release.sh \
            --version "${GITHUB_REF_NAME}" \
            --binary-dir "${CARGO_TARGET_DIR}/x86_64-unknown-linux-gnu/release" \
            --output-dir "${RUNNER_TEMP}/ssh-exam-release"
      - name: Upload GitHub Release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/ssh-exam-release/ssh-exam-${{ github.ref_name }}-linux-x86_64.tar.gz
            ${{ runner.temp }}/ssh-exam-release/SHA256SUMS

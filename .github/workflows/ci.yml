name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check operational scripts
        run: ./scripts/test-ops-scripts.sh
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo +stable test --locked

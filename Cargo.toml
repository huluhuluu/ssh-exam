[package]
name = "ssh-exam-gate"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "First-login SSH public-key exam gate"

[lib]
name = "ssh_exam_gate"
path = "src/lib.rs"

[[bin]]
name = "ssh-exam-key-policy"
path = "src/bin/ssh-exam-key-policy.rs"

[[bin]]
name = "ssh-exam-tui"
path = "src/bin/ssh-exam-tui.rs"

[[bin]]
name = "ssh-exam-admin"
path = "src/bin/ssh-exam-admin.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
askama = "0.12"
axum = { version = "0.7", features = ["form", "http1", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
hmac = "0.12"
nix = { version = "0.29", features = ["user"] }
rand = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

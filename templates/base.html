<!doctype html>
<html lang="{{ labels.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}SSH Exam Gate{% endblock %}</title>
  <style>
    :root { color-scheme:light; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#f5f6f7; color:#1d2420; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:280px; }
    a { color:inherit; }
    .topbar { background:#18201c; color:#fff; border-bottom:2px solid #3b8b62; }
    .topbar-inner, main { width:min(1180px, calc(100% - 32px)); margin:auto; }
    .topbar-inner { min-height:54px; display:flex; align-items:center; gap:18px; }
    .brand { font-size:16px; font-weight:720; white-space:nowrap; letter-spacing:0; }
    nav { display:flex; align-self:stretch; align-items:stretch; gap:2px; }
    nav a { display:flex; align-items:center; padding:0 12px; color:#dce3de; text-decoration:none; font-size:14px; border-bottom:3px solid transparent; margin-bottom:-3px; }
    nav a:hover, nav a.active { color:#fff; background:#2b332e; border-bottom-color:#6fc092; }
    .language-switch { margin-left:auto; display:flex; gap:5px; align-items:center; font-size:12px; white-space:nowrap; }
    .language-switch a { color:#dce3de; padding:5px; }
    .language-switch a:hover { color:#fff; }
    main { padding:28px 0 56px; }
    h1, h2, h3 { letter-spacing:0; color:#1d231f; }
    h1 { margin:0; font-size:24px; }
    h2 { margin:0; font-size:18px; }
    h3 { margin:0; font-size:15px; }
    p { line-height:1.45; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
    .page-head p { margin:5px 0 0; color:#5c655f; font-size:14px; }
    .page-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
    .breadcrumb { display:flex; gap:8px; align-items:center; margin:-8px 0 16px; color:#68716b; font-size:13px; }
    .breadcrumb a, .text-action { color:#236c48; font-weight:650; text-decoration:none; }
    .breadcrumb a:hover, .text-action:hover { text-decoration:underline; }
    .band { padding:20px 0; border-top:1px solid #d5dad6; }
    .band:first-of-type { border-top:0; padding-top:0; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:12px; }
    .help, .muted { color:#626b65; font-size:13px; }
    .help { margin:6px 0 14px; max-width:90ch; }
    .notice, .error, .empty { padding:11px 13px; margin:0 0 18px; border:1px solid; border-radius:4px; font-size:14px; overflow-wrap:anywhere; }
    .notice { color:#185d3b; background:#f0f8f3; border-color:#9fc9ae; }
    .error { color:#8d2020; background:#fff4f3; border-color:#d7a5a1; }
    .empty { color:#59615c; background:#fff; border-color:#d5dad6; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .metric { min-width:0; padding:13px; background:#fff; border:1px solid #d5dad6; border-radius:4px; }
    .metric strong { display:block; font-size:23px; line-height:1.1; overflow-wrap:anywhere; }
    .metric span { display:block; margin-top:5px; color:#626b65; font-size:12px; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid #d5dad6; background:#fff; }
    .summary div { min-width:0; padding:14px; border-left:1px solid #e1e4e2; }
    .summary div:first-child { border-left:0; }
    .summary span { display:block; margin-bottom:4px; color:#626b65; font-size:12px; }
    .summary strong { display:block; overflow-wrap:anywhere; }
    .overview-summary div:nth-child(3n+1) { border-left:0; }
    .overview-summary div:nth-child(n+4) { border-top:1px solid #e1e4e2; }
    .table-wrap { width:100%; overflow-x:auto; border:1px solid #d5dad6; background:#fff; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:10px 11px; text-align:left; vertical-align:top; border-bottom:1px solid #e2e5e3; overflow-wrap:anywhere; }
    tr:last-child td { border-bottom:0; }
    th { color:#505953; background:#f0f2f0; font-size:12px; font-weight:650; white-space:nowrap; }
    code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; overflow-wrap:anywhere; }
    form { margin:0; }
    .inline { display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; max-width:900px; }
    .test-create-form { max-width:1080px; }
    .form-grid .wide { grid-column:1/-1; }
    .check-stack { display:grid; gap:9px; align-content:center; }
    .check-stack label { display:flex; align-items:center; gap:8px; margin:0; font-weight:500; }
    .check-stack input { width:auto; }
    fieldset { min-width:0; margin:0; padding:0; border:0; }
    legend { margin-bottom:7px; color:#313833; font-size:13px; font-weight:650; }
    .check-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .check-option { display:grid; grid-template-columns:18px minmax(0,1fr); align-items:start; gap:9px; min-height:58px; margin:0; padding:10px; border:1px solid #cbd2cd; border-radius:4px; background:#fff; cursor:pointer; }
    .check-option:hover { border-color:#7e9f8b; background:#f7faf8; }
    .check-option:has(input:checked) { border-color:#3c805b; background:#f0f8f3; box-shadow:inset 3px 0 #3c805b; }
    .check-option input, .confirm-option input { width:16px; height:16px; margin:2px 0 0; }
    .check-option span { min-width:0; }
    .check-option strong, .check-option small { display:block; overflow-wrap:anywhere; }
    .check-option small { margin-top:3px; color:#626b65; font-size:11px; font-weight:500; }
    label { display:block; margin-bottom:5px; color:#313833; font-size:13px; font-weight:650; }
    input, select, textarea { display:block; width:100%; min-width:0; padding:8px 9px; border:1px solid #9da69f; border-radius:3px; background:#fff; color:#202522; font:inherit; font-size:14px; letter-spacing:0; }
    textarea { min-height:72px; resize:vertical; }
    .code-input { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; }
    input:focus, select:focus, textarea:focus { outline:2px solid #72a98a; outline-offset:1px; border-color:#397854; }
    button { min-height:34px; padding:6px 10px; border:1px solid #7c867f; border-radius:3px; background:#fff; color:#222824; font:inherit; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:0; white-space:normal; }
    button:hover { background:#f0f2f0; }
    button.primary { color:#fff; background:#286b48; border-color:#286b48; }
    button.primary:hover { background:#205c3d; }
    button.danger { color:#932727; border-color:#bd8582; }
    button.danger:hover { background:#fff3f2; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .status { display:inline-block; font-size:11px; font-weight:750; text-transform:uppercase; white-space:nowrap; }
    .good { color:#1c6942; }
    .bad { color:#9b2929; }
    .pending { color:#805b12; }
    .person-section { padding:22px 0; border-top:1px solid #cbd1cc; }
    .person-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:14px; }
    .person-head h2 { overflow-wrap:anywhere; }
    .person-meta { margin:4px 0 0; color:#626b65; font-size:12px; }
    .subsection { margin-top:18px; }
    .subsection h3 { margin-bottom:9px; }
    .compact-form { padding:14px 0 2px; }
    .question { padding:20px 0; border-top:1px solid #cbd1cc; }
    .question:first-child { border-top:0; padding-top:0; }
    .question-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .question-actions { margin-top:12px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .summary-compact { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .revision-line { display:flex; gap:10px; align-items:baseline; margin:15px 0 0; color:#626b65; font-size:12px; overflow-wrap:anywhere; }
    .publish-band { display:flex; justify-content:space-between; align-items:center; gap:24px; }
    .danger-zone { display:flex; justify-content:space-between; align-items:center; gap:24px; border-top-color:#d8b9b6; }
    .danger-zone h2 { color:#812828; }
    .destructive-form { display:flex; align-items:center; justify-content:flex-end; gap:12px; flex-wrap:wrap; }
    .confirm-option { display:flex; align-items:flex-start; gap:8px; max-width:360px; margin:0; color:#71302d; font-weight:550; }
    @media (max-width:680px) { .topbar-inner, main { width:min(100% - 20px,1180px); } .topbar-inner { flex-wrap:wrap; gap:0 8px; padding:8px 0; } .brand { width:100%; padding-bottom:5px; } nav { min-height:38px; order:2; } nav a { padding:0 8px; } .language-switch { order:3; margin-left:auto; } .signout { order:4; } main { padding-top:18px; } .page-head, .person-head, .danger-zone { flex-direction:column; } .page-actions, .destructive-form { width:100%; justify-content:flex-start; } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .summary { grid-template-columns:1fr; } .summary div, .summary div:nth-child(odd) { border-left:0; border-top:1px solid #e1e4e2; } .summary div:first-child { border-top:0; } .form-grid, .check-list { grid-template-columns:1fr; } .form-grid .wide { grid-column:auto; } th, td { padding:9px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">SSH Exam Gate</div>
      <nav aria-label="{{ labels.language }}">
        <a href="/"{% if active_page == "overview" %} class="active" aria-current="page"{% endif %}>{{ labels.overview }}</a>
        <a href="/people"{% if active_page == "people" %} class="active" aria-current="page"{% endif %}>{{ labels.people }}</a>
        <a href="/banks"{% if active_page == "banks" %} class="active" aria-current="page"{% endif %}>{{ labels.question_banks }}</a>
        <a href="/tests"{% if active_page == "tests" %} class="active" aria-current="page"{% endif %}>{{ labels.exam }}</a>
      </nav>
      <div class="language-switch" aria-label="{{ labels.language }}">
        <a href="/language/en?next={{ current_path }}">EN</a>
        <a href="/language/zh?next={{ current_path }}">中文</a>
        <a href="/language/bilingual?next={{ current_path }}">EN/中</a>
      </div>
      <form class="signout" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">{{ labels.sign_out }}</button>
      </form>
    </div>
  </header>
  <main>
    {% if notice.len() > 0 %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
